</script>
<style>
:root{
  --ink:#12181f; --ink2:#1b2530; --paper:#f4f6f8; --card:#ffffff;
  --line:#dfe4ea; --line2:#eef1f4; --mut:#6b7885; --mut2:#97a2ae;
  --steel:#2f6f9f; --steel-soft:#bcd4e6;
  --red:#e5484d; --red-soft:#f6cfcf;
  --gold:#c99a2e;
  --f:#2f6f9f; --d:#7a5cc0; --g:#c05c3c;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--paper); color:var(--ink);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.4;
  -webkit-font-smoothing:antialiased;
}
.tnum{font-variant-numeric:tabular-nums; font-feature-settings:"tnum"}
.eyebrow{font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--mut); font-weight:600}

/* ---- header ---- */
header{
  background:var(--ink); color:#eaf0f5; padding:18px 26px 16px;
  display:flex; align-items:flex-end; justify-content:space-between; gap:24px;
  border-bottom:3px solid var(--red);
}
.brand{display:flex; align-items:baseline; gap:14px}
.brand h1{
  margin:0; font-size:26px; font-weight:800; letter-spacing:-.01em;
}
.brand h1 .mark{color:var(--red)}
.brand .sub{font-size:12px; color:var(--mut2); letter-spacing:.02em}
.hstats{display:flex; gap:26px}
.hstat{text-align:right}
.hstat .n{font-size:20px; font-weight:700; letter-spacing:-.01em}
.hstat .l{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--mut2)}

/* ---- layout ---- */
.wrap{display:grid; grid-template-columns:minmax(340px,1fr) minmax(420px,1.35fr); gap:0; height:calc(100vh - 76px)}
@media(max-width:880px){ .wrap{grid-template-columns:1fr; height:auto} .detail{border-left:none;border-top:1px solid var(--line)} }

/* ---- list pane ---- */
.list{display:flex; flex-direction:column; min-height:0; background:var(--card)}
.controls{padding:14px 18px 10px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:10px}
.searchrow{display:flex; gap:8px}
#search{
  flex:1; padding:9px 12px; border:1px solid var(--line); border-radius:8px;
  font-size:13px; background:var(--paper); outline:none;
}
#search:focus{border-color:var(--steel); background:#fff}
.segs{display:flex; gap:4px}
.seg{
  padding:6px 11px; border:1px solid var(--line); background:#fff; border-radius:7px;
  font-size:12px; font-weight:600; color:var(--mut); cursor:pointer; user-select:none;
}
.seg[aria-pressed="true"]{background:var(--ink); color:#fff; border-color:var(--ink)}
.sortrow{display:flex; align-items:center; gap:8px}
.sortrow label{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--mut)}
#sort{padding:6px 8px; border:1px solid var(--line); border-radius:7px; font-size:12px; background:#fff}

.rows{overflow-y:auto; min-height:0; flex:1}
.row{
  display:grid; grid-template-columns:30px 1fr auto; align-items:center; gap:10px;
  padding:9px 18px; border-bottom:1px solid var(--line2); cursor:pointer; position:relative;
}
.row:hover{background:var(--paper)}
.row[aria-selected="true"]{background:#eef4f9; box-shadow:inset 3px 0 0 var(--steel)}
.rank{font-size:12px; color:var(--mut2); text-align:right}
.who{min-width:0}
.who .nm{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.who .meta{font-size:11px; color:var(--mut); display:flex; align-items:center; gap:6px}
.chip{font-size:9.5px; font-weight:800; letter-spacing:.05em; padding:1px 5px; border-radius:4px; color:#fff}
.chip.F{background:var(--f)} .chip.D{background:var(--d)} .chip.G{background:var(--g)}
.val{text-align:right; min-width:96px}
.val .num{font-weight:700; font-size:14px}
.val .bar{height:4px; background:var(--line); border-radius:3px; margin-top:4px; overflow:hidden}
.val .bar i{display:block; height:100%; background:var(--red); border-radius:3px}

/* ---- detail pane ---- */
.detail{border-left:1px solid var(--line); padding:22px 26px; overflow-y:auto; background:var(--paper)}
.dhead{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:4px}
.dhead h2{margin:0; font-size:24px; font-weight:800; letter-spacing:-.01em}
.dhead .dsub{font-size:12.5px; color:var(--mut); margin-top:3px; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.flag{font-size:10px; background:var(--gold); color:#3a2c05; padding:2px 7px; border-radius:5px; font-weight:700}

.tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:18px 0}
.tile{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 13px}
.tile .l{font-size:9.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--mut); font-weight:600}
.tile .v{font-size:22px; font-weight:800; letter-spacing:-.01em; margin-top:3px}
.tile .v small{font-size:12px; font-weight:600; color:var(--mut)}
.tile.hero{grid-column:span 3; display:flex; align-items:center; justify-content:space-between; background:var(--ink); border-color:var(--ink)}
.tile.hero .l{color:var(--mut2)}
.tile.hero .v{color:#fff; font-size:30px}
.tile.hero .band{color:var(--red-soft); font-size:13px; font-weight:600}
.tile.hero .rt{text-align:right}
.tile.hero .rt .l{color:var(--mut2)} .tile.hero .rt .v{font-size:16px}

.chartcard{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px 8px}
.chartcard .ct{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px}
.chartcard .ct .eyebrow{margin:0}
.legend{display:flex; gap:14px; font-size:11px; color:var(--mut)}
.legend span{display:inline-flex; align-items:center; gap:5px}
.legend i{width:14px; height:0; border-top:2px solid; display:inline-block}
.legend i.hist{border-color:var(--steel)}
.legend i.proj{border-top-style:dashed; border-color:var(--red)}
.legend i.band{height:9px; border:none; background:var(--red-soft); border-radius:2px}
.chartwrap{position:relative; height:280px}

.note{margin-top:16px; font-size:11.5px; color:var(--mut); line-height:1.5}
.note b{color:var(--ink2)}
details.method{margin-top:14px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:2px 14px}
details.method summary{cursor:pointer; padding:11px 0; font-size:12px; font-weight:700; letter-spacing:.04em; color:var(--ink2)}
details.method .body{font-size:12px; color:var(--mut); line-height:1.6; padding-bottom:12px}
details.method .body b{color:var(--ink2)}
.empty{color:var(--mut2); text-align:center; padding:60px 20px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>Ice <span class="mark">WAR</span>riors</h1>
    <div class="sub">NHL player value &amp; rest-of-career projections · MoneyPuck 2008–2025</div>
  </div>
  <div class="hstats tnum">
    <div class="hstat"><div class="n" id="hs-players">—</div><div class="l">Active players</div></div>
    <div class="hstat"><div class="n" id="hs-top">—</div><div class="l">Top remaining WAR</div></div>
  </div>
</header>

<div class="wrap">
  <section class="list">
    <div class="controls">
      <div class="searchrow">
        <input id="search" type="search" placeholder="Search a player…" autocomplete="off">
      </div>
      <div class="segs" id="posseg">
        <div class="seg" data-pos="ALL" aria-pressed="true">All</div>
        <div class="seg" data-pos="F" aria-pressed="false">Forwards</div>
        <div class="seg" data-pos="D" aria-pressed="false">Defense</div>
        <div class="seg" data-pos="G" aria-pressed="false">Goalies</div>
      </div>
      <div class="sortrow">
        <label for="sort">Rank by</label>
        <select id="sort">
          <option value="rem">Remaining-career WAR</option>
          <option value="total">Projected total career WAR</option>
          <option value="talent">Current talent (WAR / 82 GP)</option>
          <option value="war25">2025–26 WAR</option>
          <option value="todate">Career-to-date WAR</option>
        </select>
      </div>
    </div>
    <div class="rows" id="rows"></div>
  </section>

    (state.pos==="ALL" || p.pos===state.pos || (state.pos==="F"&&["C","L","R"].includes(p.pos))) &&
    (state.q==="" || p.name.toLowerCase().includes(state.q))
  );
  const k = sortKey[state.sort];
  out.sort((a,b)=> b[k]-a[k]);
  return out;
}

function renderList(){
  const list = filtered();
  const maxRem = Math.max(...players.map(p=>p.rem), 1);
  const rows = el("#rows");
  rows.innerHTML = "";
  list.forEach((p,i)=>{
    const posClass = ["C","L","R"].includes(p.pos)?"F":p.pos;
    const showVal = state.sort==="talent"?p.talent: state.sort==="war25"?p.war25:
                    state.sort==="todate"?p.todate: state.sort==="total"?p.total:p.rem;
    const r = document.createElement("div");
    r.className = "row"; r.dataset.id = p.id;
    r.setAttribute("aria-selected", state.selected===p.id);
    r.innerHTML = `
      <div class="rank tnum">${i+1}</div>
      <div class="who">
        <div class="nm">${p.name}</div>
        <div class="meta"><span class="chip ${posClass}">${p.pos}</span>${p.team} · ${p.age.toFixed(0)}y</div>
      </div>
      <div class="val tnum">
        <div class="num">${showVal.toFixed(1)}</div>
        <div class="bar"><i style="width:${Math.max(2,Math.min(100,p.rem/maxRem*100))}%"></i></div>
      </div>`;
    r.onclick = ()=> select(p.id);
    rows.appendChild(r);
  });
  if(!list.length) rows.innerHTML = `<div class="empty">No players match.</div>`;
}

function select(id){
  state.selected = id;
  document.querySelectorAll(".row").forEach(r=>r.setAttribute("aria-selected", +r.dataset.id===id));
  const p = players.find(x=>x.id===id);
  const posClass = ["C","L","R"].includes(p.pos)?"F":p.pos;
  const flag = p.censored ? `<span class="flag" title="No birthdate on file — age estimated from experience, so this projection is less reliable">est. age</span>`:"";
  el("#detail").innerHTML = `
    <div class="dhead">
      <div>
        <h2>${p.name}</h2>
        <div class="dsub">
          <span class="chip ${posClass}">${p.pos}</span>
          <span>${posName[posClass]} · ${p.team}</span>
          <span>·</span><span>age ${p.age.toFixed(1)} · ${p.exp} seasons in</span>${flag}
        </div>
      </div>
    </div>
    <div class="tiles">
      <div class="tile hero">
        <div><div class="l">Remaining-career WAR</div>
          <div class="v tnum">${p.rem.toFixed(1)}</div>
          <div class="band tnum">range ${p.lo.toFixed(1)} – ${p.hi.toFixed(1)}</div></div>
        <div class="rt"><div class="l">Proj. seasons left</div><div class="v tnum">${p.seasons}</div></div>
      </div>
      <div class="tile"><div class="l">2025–26 WAR</div><div class="v tnum">${p.war25.toFixed(1)}</div></div>
      <div class="tile"><div class="l">Talent rate <small>/82 GP</small></div><div class="v tnum">${p.talent.toFixed(1)}</div></div>
      <div class="tile"><div class="l">Proj. peak <small>@ ${p.peakage}</small></div><div class="v tnum">${p.peaklvl.toFixed(1)}</div></div>
      <div class="tile"><div class="l">Career to date</div><div class="v tnum">${p.todate.toFixed(1)}</div></div>
      <div class="tile"><div class="l">Proj. total career</div><div class="v tnum">${p.total.toFixed(1)}</div></div>
      <div class="tile"><div class="l">Peak season WAR</div><div class="v tnum">${Math.max(...p.hist.map(h=>h[1])).toFixed(1)}</div></div>
    </div>

    <div class="chartcard">
      <div class="ct"><div class="eyebrow">WAR by season — actual &amp; projected level</div>
        <div class="legend">
          <span><i class="hist"></i>Actual</span>
          <span><i class="proj"></i>Projected level</span>
          <span><i class="band"></i>Range</span>
        </div>
      </div>
      <div class="chartwrap"><canvas id="chart"></canvas></div>
    </div>

    <div class="note">
      <b>Reading it:</b> the projected line is the player's <b>talent level</b> — expected WAR per full 82-game season at each age — so it follows the aging curve and peaks near 25. The drop at the handoff from the last actual season is <b>regression to the mean</b> (one or two seasons is thin evidence, so the estimate is pulled toward league level). The <b>remaining-career WAR</b> above is lower than simply adding up this line, because it also discounts for games missed and the chance of retirement in each future year. Bands widen with time as uncertainty compounds.
    </div>
    <details class="method">
      <summary>How value and projections are built · and what to distrust</summary>
      <div class="body">
        <b>Value (WAR).</b> Goals-above-replacement from five components — even-strength offense (individual xG + weighted assists), even-strength defense (on-off xGA suppression), power play, penalty kill, and penalty differential — each regressed for reliability, then divided by 6 goals per win. Goalies use GSAx (expected minus actual goals against). Scale: replacement ≈ 0, average regular ≈ 1, elite ≈ 5–7.<br><br>
        <b>Projection.</b> Career stage is set by each player's <b>real age</b> (from birthdates, age as of Feb 1). An aging curve fit by the year-over-year delta method across all players peaks at age 25 and declines after. <b>Goalies use a separate, later-peaking curve (~27)</b> imposed from domain knowledge, because the goalie sample is too small and too noisy to estimate reliably from the data. Games played and survival (staying in the league) are conditioned on the player's recent role <i>and age</i> — an established full-timer keeps a full-timer's games and attrition, not the league-wide average — and that role is evolved forward each season so it decays realistically. Current talent is a recency- and games-weighted average regressed toward the mean of players in the same usage role (a full-time top-line player toward the full-timer mean, not the fringe-inclusive league median), rolled forward along all three curves. Players with no birthdate on file (~2%) get an age estimated from experience and are flagged "est. age."<br><br>
        <b>Distrust most:</b> very young players (a thin talent sample extrapolated across a full projected career), "est. age" flags (no birthdate on file), and any single-season swing — WAR here isn't RAPM-isolated, so on-ice defense still carries some teammate and deployment bias.
      </div>
    </details>`;
  drawChart(p);
}

function drawChart(p){
  const cv = el("#chart");
  if(typeof Chart === "undefined"){
    if(cv && cv.parentElement) cv.parentElement.innerHTML =
      '<div style="color:#97a2ae;text-align:center;padding:40px 10px;font-size:12px">Chart library unavailable in this viewer — the numbers above and the CSV still have everything.</div>';
    return;
  }
  try{
  const histSeasons = p.hist.map(h=>h[0]);
  const allSeasons = histSeasons.concat(p.path.map(x=>x[0]));
  const labels = allSeasons;
  const nh = p.hist.length;
  const histLine = p.hist.map(h=>h[1]).concat(p.path.map(()=>null));
  // connect last actual to first projected
  const projLine = allSeasons.map((s,i)=> i<nh-1 ? null : (i===nh-1 ? p.hist[nh-1][1] :
                   p.path[i-nh][1]));
  const bandLo = allSeasons.map((s,i)=> i<nh ? null : p.path[i-nh][2]);
  const bandHi = allSeasons.map((s,i)=> i<nh ? null : p.path[i-nh][3]);
  const cssv = k=>getComputedStyle(document.documentElement).getPropertyValue(k).trim();
  if(chart) chart.destroy();
  chart = new Chart(el("#chart"), {
    type:"line",
    data:{ labels, datasets:[
      {label:"hi", data:bandHi, borderWidth:0, pointRadius:0, fill:"+1",
       backgroundColor:"rgba(229,72,77,.14)", tension:.25, spanGaps:true},
      {label:"lo", data:bandLo, borderWidth:0, pointRadius:0, fill:false, tension:.25, spanGaps:true},
      {label:"Actual", data:histLine, borderColor:cssv("--steel"), borderWidth:2.5,
       pointRadius:2.5, pointBackgroundColor:cssv("--steel"), tension:.2, spanGaps:false},
      {label:"Projected", data:projLine, borderColor:cssv("--red"), borderWidth:2.5,
       borderDash:[5,4], pointRadius:2, pointBackgroundColor:cssv("--red"), tension:.2, spanGaps:true},
    ]},
    options:{
      responsive:true, maintainAspectRatio:false, animation:{duration:250},
      interaction:{mode:"index", intersect:false},
      scales:{
        x:{grid:{display:false}, ticks:{maxRotation:0, autoSkip:true, maxTicksLimit:10, font:{size:10}}},
        y:{grid:{color:cssv("--line2")}, ticks:{font:{size:10}}, title:{display:true, text:"WAR", font:{size:10}}}
      },
      plugins:{
        legend:{display:false},
        tooltip:{
          filter:i=>["Actual","Projected"].includes(i.dataset.label) && i.raw!=null,
          callbacks:{ label:i=>`${i.dataset.label}: ${(+i.raw).toFixed(2)} WAR` }
        },
        annotation:false
      }
    }
  });
  }catch(err){
    const cv = el("#chart");
    if(cv && cv.parentElement) cv.parentElement.innerHTML =
      '<div style="color:#97a2ae;text-align:center;padding:40px 10px;font-size:12px">Could not draw the projection chart, but the numbers above are all correct.</div>';
    console.error("chart error:", err);
  }
}

// wire controls
el("#search").addEventListener("input", e=>{ state.q=e.target.value.toLowerCase().trim(); renderList(); });
el("#sort").addEventListener("change", e=>{ state.sort=e.target.value; renderList(); });
el("#posseg").addEventListener("click", e=>{
  const s=e.target.closest(".seg"); if(!s) return;
  state.pos=s.dataset.pos;
  document.querySelectorAll("#posseg .seg").forEach(x=>x.setAttribute("aria-pressed", x===s));
  renderList();
});

// init
el("#hs-players").textContent = DATA.meta.n;
const topPlayer = [...players].sort((a,b)=>b.rem-a.rem)[0];
el("#hs-top").textContent = topPlayer.rem.toFixed(1);
renderList();
select(topPlayer.id);
</script>
</body>
</html>
